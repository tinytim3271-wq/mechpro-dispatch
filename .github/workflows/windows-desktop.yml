name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'

permissions:
  contents: read

jobs:
  build-j2534:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish J2534.Host.exe
        shell: pwsh
        run: ./diagnostics/j2534-service/scripts/publish-win-x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64/J2534.Host.exe

  build-installer:
    needs: build-j2534
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build NSIS installer and portable zip
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mechpro-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  publish-github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="desktop-v1.0.0"
          NOTES="Automated Windows build from ${GITHUB_SHA}. Includes J2534 OEM Diagnostics and 64-bit Windows adapter detection (WOW6432Node)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/windows/*.exe dist/windows/*.zip --clobber
          else
            gh release create "$TAG" dist/windows/*.exe dist/windows/*.zip \
              --title "MechPro Desktop 1.0.0" \
              --notes "$NOTES"
          fi

  publish-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish Windows installer to site bucket
        shell: bash
        run: |
          set -euo pipefail
          resolve_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" \
              --output text 2>/dev/null || true
          }
          BUCKET="$(resolve_output MechProCdnStack SiteBucketName)"
          if [[ -z "$BUCKET" || "$BUCKET" == "None" ]]; then
            BUCKET="$(resolve_output MechProStaticSiteStack SiteBucketName)"
          fi
          if [[ -z "$BUCKET" || "$BUCKET" == "None" ]]; then
            echo "Could not resolve site bucket from CloudFormation outputs." >&2
            exit 1
          fi
          echo "Publishing to s3://$BUCKET/downloads/"
          aws s3 cp dist/windows/MechPro-Setup-1.0.0.exe "s3://$BUCKET/downloads/MechPro-Setup-1.0.0.exe" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"
          aws s3 cp dist/windows/MechPro-Setup-1.0.0.zip "s3://$BUCKET/downloads/MechPro-Setup-1.0.0.zip" \
            --content-type application/zip \
            --cache-control "public, max-age=300"
          DIST_ID="$(resolve_output MechProCdnStack DistributionId)"
          if [[ -n "$DIST_ID" && "$DIST_ID" != "None" ]]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/downloads/*"
          fi
