name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mechpro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:config
      - run: test -f app.js

  validate:
    runs-on: ubuntu-latest
    needs: validate-web
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npx cdk synth --all --strict

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::001018341557:role/MechProGitHubActionsDeployRole' }}
          aws-region: us-east-1
      - run: npx cdk deploy --all --require-approval never --strict -c enableCustomDomain=true -c githubRepository=${{ github.repository }} --outputs-file cdk-outputs.json
      - name: Rebuild web bundle from CDK outputs
        run: |
          cd ..
          npm ci
          npm run build:web
      - name: Refresh static site with updated app.js
        run: npx cdk deploy MechProStaticSiteStack MechProCdnStack --require-approval never --strict -c enableCustomDomain=true
